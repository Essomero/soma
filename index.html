<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Soma</title>
    <meta
      name="description"
      content="Deep research, synthesized. A personal publishing platform for ideas that matter."
    />

    <!-- Icons. Regenerate with scripts/generate-icons.sh -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10141a" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('soma_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soma" />
    <meta property="og:title" content="Soma" />
    <meta
      property="og:description"
      content="Deep research, synthesized. A personal publishing platform for ideas that matter."
    />
    <meta property="og:url" content="https://soma.mayanja.dev/" />
    <meta property="og:image" content="https://soma.mayanja.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Soma wordmark beside a neon orange-and-teal S with a pen on a dark tile"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soma" />
    <meta
      name="twitter:description"
      content="Deep research, synthesized. A personal publishing platform for ideas that matter."
    />
    <meta name="twitter:image" content="https://soma.mayanja.dev/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
