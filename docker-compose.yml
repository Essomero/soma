# Soma — local SQLite by default (no Turso account needed)
#
# Usage:
#   cp .env.example .env   # set SITE_PASSWORD + optional AI keys
#   docker compose up --build   # uses local SQLite at /app/data/soma.db (USE_TURSO=false default)
#   # open http://localhost:3000
#
# DATABASE:
# - USE_TURSO=false (default) -> local SQLite, even if TURSO_* in .env (Docker isolation)
# - USE_TURSO=true docker compose up -> uses TURSO_* from .env
# - Or set DOCKER_TURSO_DATABASE_URL + DOCKER_TURSO_AUTH_TOKEN to use Turso in Docker
#
# Why blank Turso by default in Docker:
# Your .env may have production TURSO_* vars. Docker defaults to local to avoid
# leaking prod DB into container (which caused notes from another instance to appear).

services:
  soma:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:?Set SITE_PASSWORD in .env — e.g. openssl rand -base64 32}
      USE_TURSO: ${USE_TURSO:-false}
      # Turso — only forwarded when DOCKER_TURSO_* set or USE_TURSO=true explicitly wants it.
      # When USE_TURSO=false, api/_db.js ignores these even if present, but we blank them
      # here so prod URL doesn't leak into container env / logs.
      TURSO_DATABASE_URL: ${DOCKER_TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${DOCKER_TURSO_AUTH_TOKEN:-}
      TURSO_DB: ""
      TURSO_TOKEN: ""
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DISABLED: ${GEMINI_DISABLED:-0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      STRAITLY_API_KEY: ${STRAITLY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      UNSPLASH_APP_ID: ${UNSPLASH_APP_ID:-}
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: /app/data/soma.db
      PORT: 3000
    volumes:
      - soma_data:/app/data
    restart: unless-stopped

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    profiles: ["turso"]
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - sqld_data:/data
    command: ["sqld"]

volumes:
  soma_data:
  sqld_data:
