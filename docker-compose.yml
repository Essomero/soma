# Soma — local SQLite (no Turso, no Vercel)
# Usage:
#   cp .env.example .env   # set SITE_PASSWORD + optional AI keys
#   docker compose up --build   # reads .env automatically, no extra flags
#   # open http://localhost:3000
#
# With Turso (optional, same image):
#   Add TURSO_DATABASE_URL + TURSO_AUTH_TOKEN to .env, then compose up
#
# With local libSQL server (sqld):
#   docker compose --profile turso up --build

services:
  soma:
    build: .
    ports:
      - "3000:3000"
    # Load every var from your local .env if present (SITE_PASSWORD + AI keys + Turso)
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:?Set SITE_PASSWORD in .env — e.g. openssl rand -base64 32}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      TURSO_DB: ${TURSO_DB:-}
      TURSO_TOKEN: ${TURSO_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DISABLED: ${GEMINI_DISABLED:-0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      STRAITLY_API_KEY: ${STRAITLY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      UNSPLASH_APP_ID: ${UNSPLASH_APP_ID:-}
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: /app/data/soma.db
      PORT: 3000
    volumes:
      - soma_data:/app/data
    restart: unless-stopped

  # Optional: self-hosted libSQL server (compatible with @libsql/client)
  # Run with: docker compose --profile turso up
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    profiles: ["turso"]
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - sqld_data:/data
    command: ["sqld"]

volumes:
  soma_data:
  sqld_data:
