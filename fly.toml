# fly.toml app configuration file generated for soma on 2026-11-07T22:06:37+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soma'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  SQLITE_PATH = '/data/soma.db'
  USE_TURSO = 'false'

[[mounts]]
  source = 'soma_data'
  destination = '/data'
  initial_size = '1GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
