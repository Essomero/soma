app = "soma"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "3000"
SQLITE_PATH = "/data/soma.db"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[[mounts]]
source = "soma_data"
destination = "/data"
initial_size = "1GB"

# After `fly launch`, set secrets:
#   fly secrets set SITE_PASSWORD=your-strong-password
# Optional (uses Turso instead of /data volume):
#   fly secrets set TURSO_DATABASE_URL=libsql://... TURSO_AUTH_TOKEN=...
# Optional AI:
#   fly secrets set OPENROUTER_API_KEY=... DEEPSEEK_API_KEY=... etc.
