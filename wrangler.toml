# Soma for Cloudflare Pages (Functions + D1 or Turso remote)
#
# Deploy:
#   npm run build:static && wrangler pages deploy dist --project-name soma
#   Env: SITE_PASSWORD, USE_TURSO=true, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, AI keys

name = "soma"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# USE_TURSO = "true"
